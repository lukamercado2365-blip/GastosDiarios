services:
  expo:
    build:
      context: .
    container_name: expensetracker-expo
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - expo_node_modules:/app/node_modules
    environment:
      - EXPO_TELEMETRY_DISABLED=1
      - REACT_NATIVE_PACKAGER_HOSTNAME=${EXPO_PACKAGER_HOSTNAME:?Set EXPO_PACKAGER_HOSTNAME in .env}
    command: ["sh", "-c", "npm ci && npx expo start --lan --port 8081"]
    stdin_open: true
    tty: true

volumes:
  expo_node_modules:
