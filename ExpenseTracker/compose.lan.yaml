services:
  expo:
    build:
      context: .
    container_name: expensetracker-expo
    network_mode: host
    volumes:
      - .:/app
      - expo_node_modules:/app/node_modules
    environment:
      - EXPO_TELEMETRY_DISABLED=1
    command: ["npx", "expo", "start", "--lan", "--port", "8081"]
    stdin_open: true
    tty: true

volumes:
  expo_node_modules:
